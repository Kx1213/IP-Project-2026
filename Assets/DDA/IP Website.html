<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Login, Profile & Leaderboard</title>

  <!-- Firebase SDKs (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #f5f0e6; /* soft white oak cream */
      color: #3e2c1c; /* dark brown text */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #5a3e27; /* medium brown */
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
      color: #5a3e27;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .header img {
      width: 50px;
      height: 50px;
    }

    /* Flex container for login + leaderboard */
    .main-container {
      display: flex;
      gap: 40px;
      width: 100%;
      max-width: 1200px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #login,
    #profile,
    .leaderboard-box {
      background: #fffaf0; /* off-white oak panel */
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      min-width: 300px;
      flex: 1 1 300px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d9cbbf; /* soft brown border */
      outline: none;
      font-size: 0.95rem;
      margin-bottom: 10px;
      background: #fcf6ed; /* very light cream */
      color: #3e2c1c;
    }

    input::placeholder {
      color: #a18c75; /* soft brown */
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      margin-right: 6px;
      margin-bottom: 8px;
      background: #c9a66b; /* soft golden oak */
      color: #fffaf0;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    button:last-of-type {
      background: #8c7150; /* darker brown for forgot password */
    }

    #loginStatus {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #b78e55; /* warm brown status */
    }

    /* Leaderboard */
    ol {
      padding-left: 0;
      margin: 0;
      list-style-position: inside;
    }

    ol li {
      padding: 12px 16px;
      margin-bottom: 12px;
      background: #f0e5d8; /* light oak panel */
      border-radius: 10px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #3e2c1c;
    }

    ol li:nth-child(1) {
      background: #d4b483; /* gold-ish first place */
      font-weight: 600;
    }

    ol li:nth-child(2) {
      background: #cbb69c; /* silver-ish second */
    }

    ol li:nth-child(3) {
      background: #b89e81; /* bronze-ish third */
    }

    #profile p {
      margin: 8px 0;
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>

<!-- Header -->
<div class="header">
  <img src="logo.png" alt="Logo">
  <h1>COOKED</h1>
</div>

<!-- Main panels -->
<div class="main-container">

  <!-- Login -->
  <div id="login">
    <h2>Login / Register</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <button onclick="forgotPassword()">Forgot Password</button>
    <p id="loginStatus"></p>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard-box">
    <h2>Leaderboard</h2>
    <ol id="leaderboardList"></ol>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBayHt3kyoFxvAiDjJsLtZOalY0_IfJRhw",
    authDomain: "ip-project-2026.firebaseapp.com",
    databaseURL: "https://ip-project-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ip-project-2026",
    storageBucket: "ip-project-2026.appspot.com",
    messagingSenderId: "161050100022",
    appId: "1:161050100022:web:ff4d6673892fda025a3397"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  function register() {
    auth.createUserWithEmailAndPassword(loginEmail.value, loginPassword.value)
      .then(res => db.ref("users/" + res.user.uid).set({
        email: loginEmail.value,
        username: loginEmail.value.split("@")[0],
        points: 0
      }))
      .then(() => loginStatus.textContent = "Registered successfully!")
      .catch(err => loginStatus.textContent = err.message);
  }

  function login() {
    auth.signInWithEmailAndPassword(loginEmail.value, loginPassword.value)
      .catch(err => loginStatus.textContent = err.message);
  }

  function forgotPassword() {
    if (!loginEmail.value) return alert("Enter your email first");
    auth.sendPasswordResetEmail(loginEmail.value)
      .then(() => alert("Password reset email sent!"))
      .catch(err => alert(err.message));
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    login.style.display = user ? "none" : "block";
    if(user) loadProfile(user.uid);
  });

  function loadProfile(uid) {
    db.ref("users/" + uid).once("value").then(snap => {
      const u = snap.val();
      if(!u) return;
    });
  }

  db.ref("users").on("value", snap => {
    leaderboardList.innerHTML = "";
    const data = snap.val();
    if(!data) return;
    Object.values(data)
      .sort((a,b) => (b.points||0) - (a.points||0))
      .forEach(u => {
        const li = document.createElement("li");
        li.textContent = `${u.username||"Unknown"} - ${u.points||0} pts`;
        leaderboardList.appendChild(li);
      });
  });
</script>

</body>
</html>
